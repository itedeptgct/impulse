name: Android Build

on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            profile:
                description: Build profile
                required: true
                default: development
                type: choice
                options:
                    - development
                    - production
            version:
                description: SemVer version for production release (e.g. 1.0.1). Leave blank to use app.config.js version.
                required: false
                type: string

permissions:
    contents: write

concurrency:
    group: android-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build Android (${{ github.event_name == 'push' && 'preview' || inputs.profile }})
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Resolve build metadata
              id: meta
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "push" ]; then
                    PROFILE="preview"
                  else
                    PROFILE="${{ inputs.profile }}"
                  fi

                  APP_VERSION=$(node -e "console.log(require('./app.config.js').expo.version)")
                  if [ "$PROFILE" = "production" ] && [ -n "${{ inputs.version }}" ]; then
                    APP_VERSION="${{ inputs.version }}"
                  fi

                  SHORT_SHA="${GITHUB_SHA::7}"

                  echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
                  echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
                  echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

                  case "$PROFILE" in
                    development)
                      echo "apk_name=impulse-dev-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"
                      ;;
                    preview)
                      echo "apk_name=impulse-${APP_VERSION}-nightly.${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"
                      ;;
                    production)
                      echo "apk_name=impulse-v${APP_VERSION}-release.apk" >> "$GITHUB_OUTPUT"
                      ;;
                  esac

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Setup Java 17
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Write google-services.json from secret
              env:
                  GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: |
                  if [ -z "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
                      echo "::error::GOOGLE_SERVICES_JSON secret is not set. Add the contents of google-services.json as a repository secret."
                      exit 1
                  fi
                  printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > /tmp/google-services.json
                  echo "GOOGLE_SERVICES_JSON=/tmp/google-services.json" >> "$GITHUB_ENV"

            - name: Build Android APK with EAS Local
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: |
                  bunx eas-cli build \
                    --platform android \
                    --profile "${{ steps.meta.outputs.profile }}" \
                    --local \
                    --non-interactive \
                    --output "./${{ steps.meta.outputs.apk_name }}"

            - name: Upload Dev APK artifact
              if: ${{ steps.meta.outputs.profile == 'development' }}
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.meta.outputs.apk_name }}
                  path: ./${{ steps.meta.outputs.apk_name }}
                  retention-days: 7

            - name: Update rolling nightly tag
              if: ${{ steps.meta.outputs.profile == 'preview' }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -f nightly "${{ github.sha }}"
                  git push -f origin nightly

            - name: Publish Nightly Pre-release
              if: ${{ steps.meta.outputs.profile == 'preview' }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: nightly
                  name: Nightly Build (${{ steps.meta.outputs.version }}-nightly.${{ steps.meta.outputs.short_sha }})
                  body: |
                      Automated nightly preview build from `master` (`${{ github.sha }}`).
                      - Profile: `preview`
                      - Version: `${{ steps.meta.outputs.version }}-nightly.${{ steps.meta.outputs.short_sha }}`
                  prerelease: true
                  make_latest: false
                  files: ./${{ steps.meta.outputs.apk_name }}

            - name: Publish Production Release
              if: ${{ steps.meta.outputs.profile == 'production' }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.meta.outputs.version }}
                  name: Impulse v${{ steps.meta.outputs.version }}
                  generate_release_notes: true
                  prerelease: false
                  make_latest: true
                  files: ./${{ steps.meta.outputs.apk_name }}
